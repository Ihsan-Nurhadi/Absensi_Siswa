# Konfigurasi Nginx Host untuk Web Absensi di Port 3004 (HTTPS / SSL)
# Lokasi file di VPS: /etc/nginx/conf.d/absensi-ssl-3004.conf
# (Aplikasi lain seperti Nextcloud tetap berjalan aman di port 80 & 443)

server {
    listen 3004 ssl;
    server_name dev.nayakacloud.com;

    # Menggunakan sertifikat SSL dev.nayakacloud.com yang sudah terpasang di VPS
    ssl_certificate /etc/letsencrypt/live/dev.nayakacloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.nayakacloud.com/privkey.pem;

    # Pengaturan SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Otomatis alihkan jika pengguna membuka via HTTP (misal: http://dev.nayakacloud.com:3004)
    # Kode 497: HTTP Request Sent to HTTPS Port
    error_page 497 https://$host:3004$request_uri;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Forward ke container Docker absensi (port internal 3005)
    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:3004;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3004;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
